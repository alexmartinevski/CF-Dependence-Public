name: CF Dependence public site
on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/public-site.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/public-site.yml'
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * *'
permissions:
  contents: read
concurrency:
  group: cf-public-site
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MathML converter
        run: python -m pip install --no-deps latex2mathml==3.81.1
      - name: Validate public records
        run: python website/tests/test_public.py
      - name: Check JavaScript syntax and runtime directory rendering
        run: |
          node --check website/assets/site.js
          node --check website/assets/scholar.js
          node website/tests/test_render.js
          python website/tests/test_scholarly.py
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MathML converter
        run: python -m pip install --no-deps latex2mathml==3.81.1
      - uses: actions/configure-pages@v5
      - name: Prepare public-only site artifact
        run: |
          mkdir -p _site/assets _site/data
          cp website/index.html website/paper.html website/achievements.html website/news.html _site/
          cp website/assets/site.css website/assets/site.js website/assets/scholar.js _site/assets/
          cp website/data/papers.json website/data/news.json _site/data/
          # Read-only public metadata; failures retain the verified catalogue.
          python3 website/tools/resolve_zenodo.py website/data/papers.json _site/data/zenodo_latest.json
          cp website/robots.txt website/sitemap.xml _site/
          python3 website/tools/fingerprint_assets.py _site
          # Public-only descriptions, stable DOI identities and ORCID.
          # Optional verified Zenodo PDF mirror; never emit a broken citation_pdf_url.
          python3 website/tools/build_scholarly_pages.py website _site --repo-root . --fetch-pdfs
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
