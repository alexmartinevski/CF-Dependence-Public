name: CF Dependence public site
on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/public-site.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/public-site.yml'
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * *'
permissions:
  contents: read
concurrency:
  group: cf-public-site
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MathML converter
        run: python -m pip install --no-deps latex2mathml==3.81.1
      - name: Validate public records
        run: python website/tests/test_public.py
      - name: Check JavaScript syntax and runtime directory rendering
        run: |
          node --check website/assets/site.js
          node --check website/assets/scholar.js
          node website/tests/test_render.js
          python website/tests/test_scholarly.py
          python website/tests/test_dynamic_release.py
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MathML converter
        run: python -m pip install --no-deps latex2mathml==3.81.1
      - uses: actions/configure-pages@v5
      # Cache is advisory, never trusted: every reused byte is reverified
      # against the fixed public Zenodo DOI's MD5, size and PDF header.
      - name: Restore cached public scholarly PDFs
        uses: actions/cache/restore@v4
        with:
          path: _verified_pdf_cache
          key: cf-scholar-pdf-v2-${{ github.run_id }}
          restore-keys: |
            cf-scholar-pdf-v2-
      # One-time bootstrap from the last independently verified 18/18 Pages
      # snapshot; expected to expire eventually, but the cache persists.
      # The seed tar is never extracted to arbitrary filesystem paths.
      - name: Download prior complete public PDF bundle
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: github-pages
          run-id: 38812459965
          github-token: ${{ github.token }}
          path: _prior_public_pages
      - name: Restore only byte-verified prior public PDFs
        run: python3 website/tools/seed_pdf_cache.py website _prior_public_pages _verified_pdf_cache
      - name: Prepare public-only site artifact
        run: |
          mkdir -p _site/assets _site/data
          cp website/index.html website/paper.html website/achievements.html website/news.html _site/
          cp website/assets/site.css website/assets/site.js website/assets/scholar.js _site/assets/
          cp website/data/papers.json website/data/news.json _site/data/
          # No manually copied news cards: generate EN/RU static fallbacks from the
          # same validated JSON powering the interactive news feed.
          python3 website/tools/build_news_fallbacks.py _site
          # Read-only public metadata; failures retain the verified catalogue.
          python3 website/tools/resolve_zenodo.py website/data/papers.json _site/data/zenodo_latest.json
          cp website/robots.txt website/sitemap.xml _site/
          python3 website/tools/fingerprint_assets.py _site
          # Public-only descriptions, stable DOI identities and ORCID.
          # Optional verified Zenodo PDF mirror; never emit a broken citation_pdf_url.
          python3 website/tools/build_scholarly_pages.py website _site --repo-root . --fetch-pdfs --cache-dir _verified_pdf_cache
          touch _site/.nojekyll
      - name: Persist verified public PDF cache for later releases
        uses: actions/cache/save@v4
        with:
          path: _verified_pdf_cache
          key: cf-scholar-pdf-v2-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
